<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Original glyph drawn for this project. Gear = utility. -->
  <defs>
    <mask id="hub-hole">
      <rect width="64" height="64" fill="#ffffff"/>
      <circle cx="32" cy="32" r="8" fill="#000000"/>
    </mask>
  </defs>
  <g fill="#ffffff" mask="url(#hub-hole)">
    <g id="teeth">
      <rect x="28" y="2" width="8" height="12" rx="2"/>
      <rect x="28" y="50" width="8" height="12" rx="2"/>
      <rect x="2" y="28" width="12" height="8" rx="2"/>
      <rect x="50" y="28" width="12" height="8" rx="2"/>
    </g>
    <use href="#teeth" transform="rotate(45 32 32)"/>
    <circle cx="32" cy="32" r="17"/>
  </g>
</svg>
